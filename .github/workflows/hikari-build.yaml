name: hikari-build

permissions:
  contents: write
  
on: [workflow_dispatch]

jobs:
  build:
    runs-on: [windows-latest]
    env:
      BUILD_TYPE: Release
    steps:
    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.13.1

    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
          path: hikari-repo
          submodules: 'recursive'
          
    - name: Build hikari
      run: |
        cmake -DCMAKE_CXX_FLAGS="/utf-8" -DCMAKE_INSTALL_PREFIX=install -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_PROJECTS="clang;lld;lldb" -G "Ninja" hikari-repo/llvm
        ninja
        ninja install

    - name: Package hikari
      run: |
        7z a -v1500m hikari.zip install
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hikari
        path: hikari.zip.00*
